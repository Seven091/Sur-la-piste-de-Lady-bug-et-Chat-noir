<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Paris Explorer : Miraculous Edition</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        :root {
            --primary-miraculous: #e3000b;
            --dark-miraculous: #1a1a1a;
            --light-miraculous: #f4f4f9;
        }

        body {
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--dark-miraculous);
            color: var(--light-miraculous);
            display: flex;
            flex-direction: column;
            height: 100vh;
        }

        header {
            background: linear-gradient(135deg, var(--primary-miraculous), #000000);
            padding: 15px;
            text-align: center;
            border-bottom: 4px solid #ffd700;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-left: 30px;
            padding-right: 30px;
        }

        header h1 {
            margin: 0;
            font-size: 1.6rem;
            color: #ffffff;
            text-transform: uppercase;
            letter-spacing: 2px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.6);
        }

        #score-board {
            background: rgba(0,0,0,0.4);
            border: 2px solid #ffd700;
            padding: 8px 15px;
            border-radius: 8px;
            font-weight: bold;
            color: #ffd700;
            font-size: 1rem;
        }

        #main-container {
            display: flex;
            flex: 1;
            overflow: hidden;
        }

        #sidebar {
            width: 420px;
            background: #222222;
            border-right: 2px solid #444;
            display: flex;
            flex-direction: column;
            box-shadow: 2px 0 10px rgba(0,0,0,0.3);
            z-index: 1000;
        }

        #game-panel {
            padding: 20px;
            background: #2a2a2a;
            border-bottom: 2px solid #333;
            overflow-y: auto;
            max-height: 100%;
        }

        .login-box {
            background: #333;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 15px;
            border: 1px solid #555;
        }

        .login-box input {
            width: calc(100% - 16px);
            background: #222;
            border: 1px solid #666;
            color: white;
            padding: 8px;
            margin-top: 8px;
            border-radius: 4px;
        }

        .login-box button {
            margin-top: 10px;
            background: var(--primary-miraculous);
            color: white;
            border: none;
            width: 100%;
            padding: 8px;
            border-radius: 4px;
            font-weight: bold;
            cursor: pointer;
        }

        .question-card {
            background: #333333;
            border: 1px solid #444;
            border-radius: 8px;
            padding: 15px;
            margin-bottom: 15px;
            display: none;
        }

        .question-card.active-step {
            display: block;
            border-color: #ffd700;
        }

        .question-card h3 {
            margin: 0 0 10px;
            font-size: 1rem;
            color: #ffd700;
        }

        .question-card p {
            margin: 0 0 12px;
            font-size: 0.85rem;
            color: #ddd;
            line-height: 1.4;
        }

        .options-container {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .option-btn {
            background: #2a2a2a;
            border: 1px solid #555;
            color: white;
            padding: 8px 12px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.85rem;
            text-align: left;
            transition: all 0.2s ease;
        }

        .option-btn:hover {
            background: #3d3d3d;
            border-color: var(--primary-miraculous);
        }

        .option-btn.correct {
            background: #27ae60 !important;
            border-color: #2ecc71 !important;
            font-weight: bold;
        }

        .option-btn.incorrect {
            background: #c0392b !important;
            border-color: #e74c3c !important;
        }

        .feedback-msg {
            margin-top: 10px;
            font-size: 0.8rem;
            font-weight: bold;
        }

        .photo-challenge {
            margin-top: 12px;
            background: #1e1e1e;
            padding: 10px;
            border-radius: 6px;
            border-left: 3px solid #ffd700;
            display: none;
        }

        .photo-challenge p {
            font-size: 0.8rem;
            margin: 0 0 8px;
            color: #fff;
        }

        .photo-input-container {
            display: flex;
            gap: 8px;
            align-items: center;
        }

        .photo-file-input {
            font-size: 0.75rem;
            color: #aaa;
            flex: 1;
        }

        .photo-btn {
            background: #2980b9;
            color: white;
            border: none;
            padding: 6px 12px;
            border-radius: 4px;
            font-size: 0.8rem;
            cursor: pointer;
            font-weight: bold;
        }

        .photo-btn:hover {
            background: #3498db;
        }

        #map {
            flex: 1;
            height: 100%;
        }

        .leaflet-popup-content-wrapper {
            background: #222;
            color: #fff;
            border-radius: 8px;
            border: 2px solid var(--primary-miraculous);
            max-width: 320px;
        }

        .leaflet-popup-tip {
            background: var(--primary-miraculous);
        }

        .popup-content h3 {
            color: #ffd700;
            margin-top: 0;
            font-size: 0.95rem;
        }

        .popup-content p {
            font-size: 0.8rem;
            line-height: 1.3;
        }

        .popup-img {
            width: 100%;
            height: 150px;
            object-fit: cover;
            border-radius: 4px;
            margin-top: 5px;
            border: 1px solid #555;
        }

        .route-hint {
            background: #252525;
            padding: 6px 10px;
            border-radius: 4px;
            font-size: 0.75rem;
            color: #3498db;
            margin-bottom: 10px;
            border: 1px dashed #3498db;
        }

        @media (max-width: 768px) {
            #main-container {
                flex-direction: column-reverse;
            }
            #sidebar {
                width: 100%;
                height: 50vh;
            }
            #map {
                height: 50vh;
            }
        }
    </style>
</head>
<body>

    <header>
        <h1>Paris Explorer : Miraculous</h1>
        <div id="score-board">Score : <span id="score-val">0</span> pts</div>
    </header>

    <div id="main-container">
        <div id="sidebar">
            <div id="game-panel">
                <div class="login-box" id="login-section">
                    <h3>👥 Identification du Groupe</h3>
                    <p style="font-size: 0.8rem; color: #aaa; margin: 5px 0;">Entrez votre nom d'équipe et votre code secret pour commencer l'enquête.</p>
                    <input type="text" id="team-name" placeholder="Nom de l'équipe (ex: Équipe Ladybug)">
                    <input type="password" id="team-code" placeholder="Code secret du groupe">
                    <button onclick="startMission()">Démarrer l'aventure</button>
                </div>

                <div id="questions-container">
                    <!-- Les étapes du jeu s'injecteront ici -->
                </div>
            </div>
        </div>
        <div id="map"></div>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        /* 
           ORDRE OPTIMISÉ POUR ÉVITER LES ALLERS-RETOURS FATIGANTS DANS PARIS :
           1. Collège Françoise Dupont (Quartier Saint-Paul / Marais Sud)
           2. Boulangerie Dupain-Cheng (Quartier du Marais / Centre)
           3. Musée du Louvre & La Pyramide (1er arr., en longeant la Seine vers l'ouest)
           4. Cinéma Grand Rex (Grands Boulevards, remontée vers le nord)
           5. Tour Eiffel (7e arr., direction finale vers l'ouest)
        */
        const gameData = [
            {
                id: 1,
                name: "Le Collège Françoise Dupont",
                coords: [48.8530, 2.3690],
                realDesc: "L'école secondaire de Marinette et Adrien. Dans le dessin animé, l'architecture s'inspire des établissements parisiens traditionnels.",
                // Image de référence inspirée/simulée du dessin animé (à remplacer par votre asset local si besoin)
                imgUrl: "https://images.unsplash.com/photo-1580582932707-520aed937b7b?w=500&auto=format&fit=crop&q=60", 
                routeHint: "📍 Point de départ de votre exploration dans le secteur est de votre parcours.",
                question: "Où se rencontrent régulièrement les camarades de classe de Marinette avant le début des cours ?",
                options: [
                    "Dans la cour principale et devant les grilles de l'établissement",
                    "Sur le toit-terrasse secret de la grande tour centrale",
                    "Directement à l'intérieur de la salle de sciences physiques"
                ],
                correctIndex: 0,
                points: 10
            },
            {
                id: 2,
                name: "La Boulangerie Dupain-Cheng",
                coords: [48.8566, 2.3522],
                realDesc: "Le foyer et commerce de la famille Dupain-Cheng dans la série, situé dans un quartier vivant du centre historique.",
                imgUrl: "https://images.unsplash.com/photo-1509440159596-0249088772ff?w=500&auto=format&fit=crop&q=60", 
                routeHint: "🧭 Déplacement court et fluide vers le nord-ouest en direction du centre.",
                question: "Que trouve-t-on juste au rez-de-chaussée de l'immeuble où habite la famille de l'héroïne ?",
                options: [
                    "Une boulangerie-pâtisserie artisanale renommée",
                    "Un atelier secret de fabrication de bijoux",
                    "Une boutique exclusive de mode parisienne"
                ],
                correctIndex: 0,
                points: 10
            },
            {
                id: 3,
                name: "Le Musée du Louvre & La Pyramide",
                coords: [48.8606, 2.3376],
                realDesc: "Le plus grand musée du monde, théâtre fréquent de mystères et d'affrontements spectaculaires dans la série.",
                imgUrl: "https://images.unsplash.com/photo-1499856871958-5b9627545d1a?w=500&auto=format&fit=crop&q=60", 
                routeHint: "🧭 Continuation naturelle vers l'ouest en longeant les quais de la Seine.",
                question: "Quelle célèbre œuvre d'art mondialement connue est jalousement conservée à l'intérieur de ce palais-musée ?",
                options: [
                    "La Joconde de Léonard de Vinci",
                    "Le Penseur de Rodin",
                    "La Liberté guidant le peuple"
                ],
                correctIndex: 0,
                points: 15
            },
            {
                id: 4,
                name: "Le Cinéma Grand Rex",
                coords: [48.8708, 2.3488],
                realDesc: "La célèbre salle obscure des grands boulevards où les personnages aiment se détendre et sortir entre amis.",
                imgUrl: "https://images.unsplash.com/photo-1489599849927-2ee91cede3ba?w=500&auto=format&fit=crop&q=60", 
                routeHint: "🧭 Courte remontée vers le nord en direction des Grands Boulevards.",
                question: "Quel type d'événement ou de loisir culturel attire particulièrement les adolescents dans ce lieu emblématique ?",
                options: [
                    "Assister à la projection sur grand écran de films populaires",
                    "Participer à des tournois sportifs d'escrime en plein air",
                    "Visiter une exposition permanente d'objets anciens"
                ],
                correctIndex: 0,
                points: 10
            },
            {
                id: 5,
                name: "La Tour Eiffel",
                coords: [48.8584, 2.2945],
                realDesc: "L'emblème absolu de Paris, point de vue imprenable et terrain de voltige incontournable de Ladybug et Chat Noir.",
                imgUrl: "https://images.unsplash.com/photo-1511739001486-6bfe10ce785f?w=500&auto=format&fit=crop&q=60", 
                routeHint: "🧭 Grand final vers l'ouest le long de la Seine pour achever le parcours en beauté.",
                question: "Pour quel événement majeur du 19e siècle ce monument de fer de 330 mètres a-t-il été édifié en 1889 ?",
                options: [
                    "Les Jeux Olympiques d'été",
                    "L'Exposition universelle de Paris",
                    "Le centenaire de la Révolution française"
                ],
                correctIndex: 1,
                points: 15
            }
        ];

        let currentScore = 0;

        // Initialisation de la carte centrée sur Paris
        const map = L.map('map').setView([48.8566, 2.3522], 13);

        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            maxZoom: 19,
            attribution: '&copy; OpenStreetMap contributors'
        }).addTo(map);

        const markers = {};

        function startMission() {
            const teamName = document.getElementById('team-name').value.trim();
            const teamCode = document.getElementById('team-code').value.trim();

            if (!teamName || !teamCode) {
                alert("Veuillez entrer un nom d'équipe et un code pour lancer l'aventure !");
                return;
            }

            document.getElementById('login-section').style.display = 'none';
            buildGameInterface();
        }

        function buildGameInterface() {
            const container = document.getElementById('questions-container');
            container.innerHTML = "";

            gameData.forEach((item, index) => {
                // Création du marqueur sur la carte avec l'image du dessin animé/lieu réel
                const marker = L.marker(item.coords).addTo(map);
                marker.bindPopup(`
                    <div class="popup-content">
                        <h3>📍 ${item.name}</h3>
                        <p>${item.realDesc}</p>
                        <img src="${item.imgUrl}" class="popup-img" alt="${item.name}">
                    </div>
                `);
                markers[item.id] = marker;

                // Création de la carte de question
                const card = document.createElement('div');
                card.className = `question-card ${index === 0 ? 'active-step' : ''}`;
                card.id = `card-${item.id}`;

                let optionsHtml = '';
                item.options.forEach((opt, optIndex) => {
                    optionsHtml += `<button class="option-btn" onclick="checkAnswer(${item.id}, ${optIndex})">${opt}</button>`;
                });

                card.innerHTML = `
                    <h3>Étape ${index + 1} : ${item.name}</h3>
                    <div class="route-hint">${item.routeHint}</div>
                    <p><strong>Énigme :</strong> ${item.question}</p>
                    <div class="options-container" id="options-${item.id}">
                        ${optionsHtml}
                    </div>
                    <div class="feedback-msg" id="feedback-${item.id}"></div>
                    <div class="photo-challenge" id="photo-${item.id}">
                        <p>📸 <strong>Preuve Photo (Paris Explorer) :</strong> Téléchargez la photo de votre groupe prise sur le site réel pour valider l'étape !</p>
                        <div class="photo-input-container">
                            <input type="file" accept="image/*" class="photo-file-input" id="file-${item.id}">
                            <button class="photo-btn" onclick="validatePhoto(${item.id})">Envoyer</button>
                        </div>
                    </div>
                `;

                container.appendChild(card);
            });
        }

        function checkAnswer(id, selectedOptionIndex) {
            const item = gameData.find(i => i.id === id);
            const optionsContainer = document.getElementById(`options-${id}`);
            const feedbackEl = document.getElementById(`feedback-${id}`);
            const photoBox = document.getElementById(`photo-${id}`);
            const buttons = optionsContainer.getElementsByTagName('button');

            for (let btn of buttons) {
                btn.disabled = true;
            }

            if (selectedOptionIndex === item.correctIndex) {
                buttons[selectedOptionIndex].classList.add('correct');
                feedbackEl.style.color = "#2ecc71";
                feedbackEl.innerHTML = "✨ Bonne réponse ! Le lieu est repéré sur la carte.";

                // Centrer la carte sur le lieu et ouvrir le pop-up avec l'image
                map.flyTo(item.coords, 16, { animate: true, duration: 1.5 });
                markers[id].openPopup();

                // Afficher le défi photo conforme à Paris Explorer
                photoBox.style.display = "block";
            } else {
                buttons[selectedOptionIndex].classList.add('incorrect');
                buttons[item.correctIndex].classList.add('correct');
                feedbackEl.style.color = "#e74c3c";
                feedbackEl.innerHTML = "❌ Erreur. Regarde la bonne réponse et repère le lieu sur le plan.";

                map.flyTo(item.coords, 15, { animate: true, duration: 1.5 });
                markers[id].openPopup();

                // Passer à l'étape suivante après un court délai pour ne pas bloquer les enfants
                setTimeout(() => nextStep(id), 3500);
            }
        }

        function validatePhoto(id) {
            const fileInput = document.getElementById(`file-${id}`);
            if (fileInput.files.length === 0) {
                alert("Veuillez sélectionner ou prendre une photo de votre groupe sur le lieu pour valider l'étape !");
                return;
            }

            const item = gameData.find(i => i.id === id);
            currentScore += item.points;
            document.getElementById('score-val').innerText = currentScore;

            const photoBox = document.getElementById(`photo-${id}`);
            photoBox.innerHTML = "<p style='color: #2ecc71; font-weight: bold;'>✅ Preuve photo validée ! Points enregistrés.</p>";

            setTimeout(() => nextStep(id), 1500);
        }

        function nextStep(currentId) {
            const currentIndex = gameData.findIndex(i => i.id === currentId);
            const currentCard = document.getElementById(`card-${currentId}`);
            currentCard.classList.remove('active-step');

            if (currentIndex + 1 < gameData.length) {
                const nextItem = gameData[currentIndex + 1];
                const nextCard = document.getElementById(`card-${nextItem.id}`);
                nextCard.classList.add('active-step');
            } else {
                // Fin du jeu
                const container = document.getElementById('questions-container');
                container.innerHTML = `
                    <div class="question-card active-step" style="text-align: center;">
                        <h2 style="color: #ffd700;">🎉 Mission Accomplie !</h2>
                        <p>Félicitations à votre équipe ! Vous avez retrouvé tous les repères parisiens de Marinette et ses amis en optimisant vos déplacements.</p>
                        <p style="font-size: 1.2rem; font-weight: bold; color: #2ecc71;">Score Final : ${currentScore} points</p>
                        <p style="font-size: 0.85rem; color: #aaa;">Paris n'a plus de secrets pour vous. Transformez-vous en héros du quotidien !</p>
                    </div>
                `;
            }
        }
    </script>
</body>
</html>
