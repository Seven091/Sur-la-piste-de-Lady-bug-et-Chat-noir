<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Paris Explorer : Miraculous Edition</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        :root {
            --primary-miraculous: #e3000b;
            --dark-miraculous: #1a1a1a;
            --light-miraculous: #f4f4f9;
        }

        body {
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--dark-miraculous);
            color: var(--light-miraculous);
            display: flex;
            flex-direction: column;
            height: 100vh;
        }

        header {
            background: linear-gradient(135deg, var(--primary-miraculous), #000000);
            padding: 15px;
            text-align: center;
            border-bottom: 4px solid #ffd700;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
        }

        header h1 {
            margin: 0;
            font-size: 1.8rem;
            color: #ffffff;
            text-transform: uppercase;
            letter-spacing: 2px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.6);
        }

        header p {
            margin: 5px 0 0;
            font-size: 0.9rem;
            color: #ffcccc;
        }

        #main-container {
            display: flex;
            flex: 1;
            overflow: hidden;
        }

        #sidebar {
            width: 400px;
            background: #222222;
            border-right: 2px solid #444;
            display: flex;
            flex-direction: column;
            box-shadow: 2px 0 10px rgba(0,0,0,0.3);
            z-index: 1000;
        }

        #game-panel {
            padding: 20px;
            background: #2a2a2a;
            border-bottom: 2px solid #333;
            overflow-y: auto;
            max-height: 100%;
        }

        #game-panel h2 {
            margin-top: 0;
            color: #ffd700;
            font-size: 1.1rem;
        }

        .question-card {
            background: #333333;
            border: 1px solid #444;
            border-radius: 8px;
            padding: 15px;
            margin-bottom: 15px;
        }

        .question-card h3 {
            margin: 0 0 10px;
            font-size: 0.95rem;
            color: #ffd700;
        }

        .question-card p {
            margin: 0 0 12px;
            font-size: 0.85rem;
            color: #ddd;
            line-height: 1.4;
        }

        .options-container {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .option-btn {
            background: #2a2a2a;
            border: 1px solid #555;
            color: white;
            padding: 8px 12px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.85rem;
            text-align: left;
            transition: all 0.2s ease;
        }

        .option-btn:hover {
            background: #3d3d3d;
            border-color: var(--primary-miraculous);
        }

        .option-btn.correct {
            background: #27ae60 !important;
            border-color: #2ecc71 !important;
            font-weight: bold;
        }

        .option-btn.incorrect {
            background: #c0392b !important;
            border-color: #e74c3c !important;
        }

        .feedback-msg {
            margin-top: 10px;
            font-size: 0.8rem;
            font-weight: bold;
        }

        #map {
            flex: 1;
            height: 100%;
        }

        .leaflet-popup-content-wrapper {
            background: #222;
            color: #fff;
            border-radius: 8px;
            border: 2px solid var(--primary-miraculous);
        }

        .leaflet-popup-tip {
            background: var(--primary-miraculous);
        }

        .popup-content h3 {
            color: #ffd700;
            margin-top: 0;
        }

        .popup-content p {
            font-size: 0.85rem;
            line-height: 1.4;
        }

        @media (max-width: 768px) {
            #main-container {
                flex-direction: column-reverse;
            }
            #sidebar {
                width: 100%;
                height: 50vh;
            }
            #map {
                height: 50vh;
            }
        }
    </style>
</head>
<body>

    <header>
        <h1>Paris Explorer : Miraculous Edition</h1>
        <p>Jeu de questions-réponses pour découvrir les vrais monuments parisiens de Marinette !</p>
    </header>

    <div id="main-container">
        <div id="sidebar">
            <div id="game-panel">
                <h2>🎯 Questionnaire Parisien</h2>
                <p style="font-size: 0.85rem; color: #aaa; margin-bottom: 15px;">Réponds aux énigmes géographiques et culturelles. Chaque bonne réponse mettra le monument en valeur sur le plan interactif !</p>
                <div id="questions-container">
                    <!-- Les questions du jeu s'injecteront ici -->
                </div>
            </div>
        </div>
        <div id="map"></div>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        // Données du jeu Paris Explorer (Thème Miraculous / Lieux réels)
        const gameData = [
            {
                id: 1,
                name: "La Boulangerie Dupain-Cheng (Quartier historique)",
                coords: [48.8566, 2.3522],
                realDesc: "Le quartier de la célèbre boulangerie s'inspire du cœur historique de Paris. Dans la vraie vie, ces quartiers pittoresques regorgent de commerces de proximité traditionnels.",
                question: "Dans quel secteur historique du centre de Paris s'intègre l'ambiance des ruelles fréquentées par Marinette ?",
                options: [
                    "Le Marais / Centre historique",
                    "Le quartier financier de La Défense",
                    "Le sommet de la colline de Montmartre"
                ],
                correctIndex: 0
            },
            {
                id: 2,
                name: "Le Musée du Louvre & La Pyramide",
                coords: [48.8606, 2.3376],
                realDesc: "Point de ralliement de la course d'orientation amicale dans l'épisode 'Ikari Gozen'. C'est le plus grand musée d'art au monde.",
                question: "Quelle célèbre structure géométrique en verre et métal trône au milieu de la cour principale du Louvre ?",
                options: [
                    "Un immense dôme art déco",
                    "Une pyramide moderne",
                    "Un obélisque égyptien ancien"
                ],
                correctIndex: 1
            },
            {
                id: 3,
                name: "Les Quais de Seine",
                coords: [48.8584, 2.3372],
                realDesc: "Parcourus par les duos d'amis le long du fleuve dans 'Ikari Gozen'. Un site classé au patrimoine mondial de l'UNESCO.",
                episodeRef: "Épisode : Ikari Gozen",
                question: "Comment nomme-t-on les fameux boîtiers métalliques verts des vendeurs de livres d'occasion fixés sur les murets de ce fleuve ?",
                options: [
                    "Les armoires à livres",
                    "Les boîtes aux lettres royales",
                    "Les boîtes des bouquinistes"
                ],
                correctIndex: 2
            },
            {
                id: 4,
                name: "La Place des Vosges",
                coords: [48.8556, 2.3656],
                realDesc: "L'une des plus anciennes places de Paris, cadre de promenades bucoliques pour les personnages.",
                question: "Sous quel nom royal cette place carrée historique bordée de briques rouges a-t-elle été initialement inaugurée sous Louis XIII ?",
                options: [
                    "La Place Royale",
                    "La Place de l'Empire",
                    "La Place de la République"
                ],
                correctIndex: 0
            },
            {
                id: 5,
                name: "La Tour Eiffel",
                coords: [48.8584, 2.2945],
                realDesc: "L'emblème de la capitale, théâtre des voltiges aériennes de Ladybug et Chat Noir.",
                question: "Pour quel événement majeur du 19e siècle ce monument de fer de 330 mètres a-t-il été édifié en 1889 ?",
                options: [
                    "Les Jeux Olympiques d'été",
                    "L'Exposition universelle de Paris",
                    "Le centenaire de la Révolution française"
                ],
                correctIndex: 1
            }
        ];

        // Initialisation de la carte centrée sur Paris
        const map = L.map('map').setView([48.8566, 2.3522], 13);

        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            maxZoom: 19,
            attribution: '&copy; OpenStreetMap contributors'
        }).addTo(map);

        const markers = {};
        const questionsContainer = document.getElementById('questions-container');

        // Génération dynamique des questions (Principe de Paris Explorer)
        gameData.forEach((item, index) => {
            // Création du marqueur masqué ou initial sur la carte
            const marker = L.marker(item.coords).addTo(map);
            marker.bindPopup(`
                <div class="popup-content">
                    <h3>${item.name}</h3>
                    <p>${item.realDesc}</p>
                </div>
            `);
            markers[item.id] = marker;

            // Création de la carte de question dans le panneau latéral
            const card = document.createElement('div');
            card.className = 'question-card';
            card.id = `card-${item.id}`;

            let optionsHtml = '';
            item.options.forEach((opt, optIndex) => {
                optionsHtml += `<button class="option-btn" onclick="checkAnswer(${item.id}, ${optIndex})">${opt}</button>`;
            });

            card.innerHTML = `
                <h3>Étape ${index + 1}</h3>
                <p><strong>Question :</strong> ${item.question}</p>
                <div class="options-container" id="options-${item.id}">
                    ${optionsHtml}
                </div>
                <div class="feedback-msg" id="feedback-${item.id}"></div>
            `;

            questionsContainer.appendChild(card);
        });

        // Fonction de vérification propre à Paris Explorer
        function checkAnswer(id, selectedOptionIndex) {
            const item = gameData.find(i => i.id === id);
            const optionsContainer = document.getElementById(`options-${id}`);
            const feedbackEl = document.getElementById(`feedback-${id}`);
            const buttons = optionsContainer.getElementsByTagName('button');

            // Désactiver tous les boutons de cette question après un choix
            for (let btn of buttons) {
                btn.disabled = true;
            }

            if (selectedOptionIndex === item.correctIndex) {
                buttons[selectedOptionIndex].classList.add('correct');
                feedbackEl.style.color = "#2ecc71";
                feedbackEl.innerHTML = "✨ Bonne réponse ! Le lieu s'illumine sur le plan.";

                // Action sur la carte : zoomer et ouvrir le popup du lieu découvert
                map.flyTo(item.coords, 16, {
                    animate: true,
                    duration: 1.5
                });
                markers[id].openPopup();
            } else {
                buttons[selectedOptionIndex].classList.add('incorrect');
                buttons[item.correctIndex].classList.add('correct');
                feedbackEl.style.color = "#e74c3c";
                feedbackEl.innerHTML = "❌ Mauvaise réponse. Regarde la bonne réponse en vert et repère-la sur le plan.";

                // Centrer quand même pour montrer l'emplacement réel aux enfants
                map.flyTo(item.coords, 15, {
                    animate: true,
                    duration: 1.5
                });
                markers[id].openPopup();
            }
        }
    </script>
</body>
</html>
