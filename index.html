<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Paris Explorer : Miraculous Edition</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        :root {
            --primary-miraculous: #e3000b;
            --dark-miraculous: #1a1a1a;
            --light-miraculous: #f4f4f9;
            --accent-ladybug: #ff4d4d;
        }

        body {
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--dark-miraculous);
            color: var(--light-miraculous);
            display: flex;
            flex-direction: column;
            height: 100vh;
        }

        header {
            background: linear-gradient(135deg, var(--primary-miraculous), #000000);
            padding: 15px;
            text-align: center;
            border-bottom: 4px solid #ffd700;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
        }

        header h1 {
            margin: 0;
            font-size: 1.8rem;
            color: #ffffff;
            text-transform: uppercase;
            letter-spacing: 2px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.6);
        }

        header p {
            margin: 5px 0 0;
            font-size: 0.9rem;
            color: #ffcccc;
        }

        #main-container {
            display: flex;
            flex: 1;
            overflow: hidden;
        }

        #sidebar {
            width: 350px;
            background: #222222;
            border-right: 2px solid #444;
            display: flex;
            flex-direction: column;
            box-shadow: 2px 0 10px rgba(0,0,0,0.3);
            z-index: 1000;
        }

        #mission-panel {
            padding: 20px;
            background: #2a2a2a;
            border-bottom: 2px solid #333;
        }

        #mission-panel h2 {
            margin-top: 0;
            color: #ffd700;
            font-size: 1.2rem;
        }

        #locations-list {
            flex: 1;
            overflow-y: auto;
            padding: 10px;
        }

        .location-card {
            background: #333333;
            border: 1px solid #444;
            border-radius: 8px;
            padding: 12px;
            margin-bottom: 10px;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .location-card:hover {
            background: #3d3d3d;
            border-color: var(--primary-miraculous);
            transform: translateY(-2px);
        }

        .location-card.active {
            border-color: #ffd700;
            background: #402222;
        }

        .location-card h3 {
            margin: 0 0 5px;
            font-size: 1rem;
            color: #fff;
        }

        .location-card p {
            margin: 0;
            font-size: 0.8rem;
            color: #aaa;
        }

        #map {
            flex: 1;
            height: 100%;
        }

        .leaflet-popup-content-wrapper {
            background: #222;
            color: #fff;
            border-radius: 8px;
            border: 2px solid var(--primary-miraculous);
        }

        .leaflet-popup-tip {
            background: var(--primary-miraculous);
        }

        .popup-content h3 {
            color: #ffd700;
            margin-top: 0;
        }

        .popup-content p {
            font-size: 0.85rem;
            line-height: 1.4;
        }

        .popup-badge {
            display: inline-block;
            background: var(--primary-miraculous);
            color: white;
            padding: 2px 6px;
            border-radius: 4px;
            font-size: 0.75rem;
            margin-top: 5px;
            font-weight: bold;
        }

        @media (max-width: 768px) {
            #main-container {
                flex-direction: column-reverse;
            }
            #sidebar {
                width: 100%;
                height: 40vh;
            }
            #map {
                height: 60vh;
            }
        }
    </style>
</head>
<body>

    <header>
        <h1>Paris Explorer : Miraculous Edition</h1>
        <p>Découvre les vrais lieux parisiens de Marinette et Adrien à travers la ville !</p>
    </header>

    <div id="main-container">
        <div id="sidebar">
            <div id="mission-panel">
                <h2>🎯 Mission d'Exploration</h2>
                <p id="mission-desc">Sélectionne une étape pour découvrir le site réel qui a inspiré le dessin animé.</p>
            </div>
            <div id="locations-list">
                <!-- Généré dynamiquement en JS -->
            </div>
        </div>
        <div id="map"></div>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        // Données des lieux inspirés de Miraculous et de l'épisode Ikari Gozen
        const miraculousLocations = [
            {
                id: 1,
                name: "La Boulangerie Dupain-Cheng",
                coords: [48.8566, 2.3522], // Coordonnées fictives/représentatives dans le 3e/4e arrondissement
                realName: "Boulangerie Traditionnelle Parisienne (Inspiration)",
                description: "Le quartier de la célèbre boulangerie de Marinette s'inspire du Marais et des rues pittoresques de Paris. Dans la vraie vie, les boulangeries traditionnelles françaises regorgent de croissants et de macarons !",
                episodeRef: "Lieu emblématique de la série"
            },
            {
                id: 2,
                name: "Le Musée du Louvre & La Pyramide",
                coords: [48.8606, 2.3376],
                realName: "Musée du Louvre",
                description: "Point de rassemblement crucial dans l'épisode 'Ikari Gozen' pour la course d'orientation amicale. C'est le plus grand musée d'art au monde, abritant la Joconde.",
                episodeRef: "Épisode : Ikari Gozen"
            },
            {
                id: 3,
                name: "Les Quais de Seine",
                coords: [48.8584, 2.3372],
                realName: "Les Quais de la Seine",
                description: "Parcourus par les duos d'amis lors de leur chasse aux indices dans 'Ikari Gozen'. Les berges de la Seine offrent une vue imprenable et sont classées au patrimoine mondial de l'UNESCO.",
                episodeRef: "Épisode : Ikari Gozen"
            },
            {
                id: 4,
                name: "La Place des Vosges",
                coords: [48.8556, 2.3656],
                realName: "Place des Vosges",
                description: "L'un des plus anciens parcs de Paris, souvent représenté ou évoqué pour les promenades des personnages dans le quartier. Un lieu réel chargé d'histoire littéraire et architecturale.",
                episodeRef: "Quartier résidentiel fréquenté"
            },
            {
                id: 5,
                name: "La Tour Eiffel",
                coords: [48.8584, 2.2945],
                realName: "Tour Eiffel",
                description: "Le symbole ultime de Paris et le terrain de jeu aérien favori de Ladybug et Chat Noir pour leurs patrouilles ou leurs combats contre les akumas.",
                episodeRef: "Présent dans tous les épisodes"
            }
        ];

        // Initialisation de la carte centrée sur Paris
        const map = L.map('map').setView([48.8566, 2.3522], 13);

        // Ajout du fond de carte OpenStreetMap
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            maxZoom: 19,
            attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors'
        }).addTo(map);

        const markers = {};
        const listContainer = document.getElementById('locations-list');
        const missionDesc = document.getElementById('mission-desc');

        // Génération de la liste et des marqueurs sur la carte
        miraculousLocations.forEach(loc => {
            // Création du marqueur Leaflet
            const marker = L.marker(loc.coords).addTo(map);
            
            marker.bindPopup(`
                <div class="popup-content">
                    <h3>${loc.name}</h3>
                    <p><strong>Lieu réel :</strong> ${loc.realName}</p>
                    <p>${loc.description}</p>
                    <span class="popup-badge">${loc.episodeRef}</span>
                </div>
            `);

            markers[loc.id] = marker;

            // Création de la carte dans la barre latérale
            const card = document.createElement('div');
            card.className = 'location-card';
            card.innerHTML = `
                <h3>${loc.name}</h3>
                <p>${loc.realName}</p>
            `;

            card.addEventListener('click', () => {
                // Retirer la classe active de toutes les cartes
                document.querySelectorAll('.location-card').forEach(c => c.classList.remove('active'));
                card.classList.add('active');

                // Centrer la carte sur le lieu choisi et ouvrir le popup
                map.flyTo(loc.coords, 16, {
                    animate: true,
                    duration: 1.5
                });
                marker.openPopup();

                // Mettre à jour le texte de mission
                missionDesc.innerHTML = `<strong>Exploration :</strong> ${loc.name}<br><span style="font-size:0.85rem; color:#ccc;">${loc.description}</span>`;
            });

            listContainer.appendChild(card);
        });
    </script>
</body>
</html>
