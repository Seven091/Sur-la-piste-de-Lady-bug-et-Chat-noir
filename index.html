<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Paris Explorer : Miraculous Edition</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        :root {
            --primary-miraculous: #e3000b;
            --dark-miraculous: #1a1a1a;
            --light-miraculous: #f4f4f9;
        }

        body {
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--dark-miraculous);
            color: var(--light-miraculous);
            display: flex;
            flex-direction: column;
            height: 100vh;
        }

        header {
            background: linear-gradient(135deg, var(--primary-miraculous), #000000);
            padding: 15px;
            text-align: center;
            border-bottom: 4px solid #ffd700;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
        }

        header h1 {
            margin: 0;
            font-size: 1.8rem;
            color: #ffffff;
            text-transform: uppercase;
            letter-spacing: 2px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.6);
        }

        header p {
            margin: 5px 0 0;
            font-size: 0.9rem;
            color: #ffcccc;
        }

        #main-container {
            display: flex;
            flex: 1;
            overflow: hidden;
        }

        #sidebar {
            width: 380px;
            background: #222222;
            border-right: 2px solid #444;
            display: flex;
            flex-direction: column;
            box-shadow: 2px 0 10px rgba(0,0,0,0.3);
            z-index: 1000;
        }

        #mission-panel {
            padding: 20px;
            background: #2a2a2a;
            border-bottom: 2px solid #333;
        }

        #mission-panel h2 {
            margin-top: 0;
            color: #ffd700;
            font-size: 1.2rem;
        }

        #locations-list {
            flex: 1;
            overflow-y: auto;
            padding: 10px;
        }

        .location-card {
            background: #333333;
            border: 1px solid #444;
            border-radius: 8px;
            padding: 12px;
            margin-bottom: 12px;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .location-card:hover {
            background: #3d3d3d;
            border-color: var(--primary-miraculous);
            transform: translateY(-2px);
        }

        .location-card.active {
            border-color: #ffd700;
            background: #402222;
        }

        .location-card h3 {
            margin: 0 0 5px;
            font-size: 0.95rem;
            color: #ffd700;
        }

        .location-card p {
            margin: 0 0 10px;
            font-size: 0.85rem;
            color: #ddd;
        }

        .question-box {
            background: #1e1e1e;
            padding: 8px;
            border-radius: 6px;
            border-left: 3px solid var(--primary-miraculous);
            font-size: 0.8rem;
            margin-bottom: 8px;
        }

        .answer-container {
            display: flex;
            gap: 5px;
        }

        .answer-input {
            flex: 1;
            background: #2a2a2a;
            border: 1px solid #555;
            color: white;
            padding: 5px;
            border-radius: 4px;
            font-size: 0.8rem;
        }

        .answer-btn {
            background: var(--primary-miraculous);
            color: white;
            border: none;
            padding: 5px 10px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 0.8rem;
            font-weight: bold;
        }

        .answer-btn:hover {
            background: #ff1a25;
        }

        .feedback {
            margin-top: 5px;
            font-size: 0.75rem;
            font-weight: bold;
        }

        #map {
            flex: 1;
            height: 100%;
        }

        .leaflet-popup-content-wrapper {
            background: #222;
            color: #fff;
            border-radius: 8px;
            border: 2px solid var(--primary-miraculous);
        }

        .leaflet-popup-tip {
            background: var(--primary-miraculous);
        }

        .popup-content h3 {
            color: #ffd700;
            margin-top: 0;
        }

        .popup-content p {
            font-size: 0.85rem;
            line-height: 1.4;
        }

        .popup-badge {
            display: inline-block;
            background: var(--primary-miraculous);
            color: white;
            padding: 2px 6px;
            border-radius: 4px;
            font-size: 0.75rem;
            margin-top: 5px;
            font-weight: bold;
        }

        @media (max-width: 768px) {
            #main-container {
                flex-direction: column-reverse;
            }
            #sidebar {
                width: 100%;
                height: 45vh;
            }
            #map {
                height: 55vh;
            }
        }
    </style>
</head>
<body>

    <header>
        <h1>Paris Explorer : Miraculous Edition</h1>
        <p>Relève les défis géographiques des lieux visités par Marinette et ses amis !</p>
    </header>

    <div id="main-container">
        <div id="sidebar">
        <div id="mission-panel">
                <h2>🎯 Enquête Parisienne</h2>
                <p id="mission-desc">Clique sur un lieu pour le localiser sur le plan, puis réponds au défi pour prouver ta connaissance de Paris et de la série.</p>
            </div>
            <div id="locations-list">
                <!-- Généré dynamiquement -->
            </div>
        </div>
        <div id="map"></div>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        // Données des missions géographiques et culturelles
        const miraculousLocations = [
            {
                id: 1,
                name: "La Boulangerie Dupain-Cheng",
                coords: [48.8566, 2.3522],
                realName: "Boulangerie Traditionnelle (Quartier du Marais)",
                description: "Le repère familial de Marinette. Dans la vraie vie, ce type de commerce de quartier fait battre le cœur de la gastronomie française.",
                episodeRef: "Quartier résidentiel de référence",
                question: "Dans quel arrondissement fictif (proche du centre historique) se situe principalement l'action quotidienne de Marinette ? (Indice : entre le 3e et 4e)",
                answer: "3"
            },
            {
                id: 2,
                name: "Le Musée du Louvre & La Pyramide",
                coords: [48.8606, 2.3376],
                realName: "Musée du Louvre",
                description: "Point de ralliement de la chasse aux trésors dans l'épisode 'Ikari Gozen'. C'est le plus grand musée d'art et d'antiquités au monde.",
                episodeRef: "Épisode : Ikari Gozen",
                question: "Quelle célèbre structure en verre et en métal orne la cour principale du Louvre ?",
                answer: "pyramide"
            },
            {
                id: 3,
                name: "Les Quais de Seine",
                coords: [48.8584, 2.3372],
                realName: "Les Berges de la Seine",
                description: "Parcourus par les duos d'amis le long du fleuve. Un site classé au patrimoine mondial de l'UNESCO.",
                episodeRef: "Épisode : Ikari Gozen",
                question: "Comment appelle-t-on les célèbres boîtes vertes des marchands de livres anciens installés le long de ce fleuve ?",
                answer: "bouquinistes"
            },
            {
                id: 4,
                name: "La Place des Vosges",
                coords: [48.8556, 2.3656],
                realName: "Place des Vosges",
                description: "L'une des plus anciennes places de Paris, cadre de promenades bucoliques pour les personnages.",
                episodeRef: "Ambiance des parcs parisiens",
                question: "Sous quel ancien nom royal cette place historique a-t-elle été initialement construite sous Louis XIII ?",
                answer: "place royale"
            },
            {
                id: 5,
                name: "La Tour Eiffel",
                coords: [48.8584, 2.2945],
                realName: "Tour Eiffel",
                description: "L'emblème de la capitale, théâtre des voltiges de Ladybug et Chat Noir.",
                episodeRef: "Panorama permanent de la série",
                question: "Pour quelle grande exposition universelle ce monument de 330 mètres a-t-il été construit en 1889 ?",
                answer: "exposition universelle"
            }
        ];

        // Initialisation de la carte
        const map = L.map('map').setView([48.8566, 2.3522], 13);

        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            maxZoom: 19,
            attribution: '&copy; OpenStreetMap contributors'
        }).addTo(map);

        const markers = {};
        const listContainer = document.getElementById('locations-list');
        const missionDesc = document.getElementById('mission-desc');

        miraculousLocations.forEach(loc => {
            const marker = L.marker(loc.coords).addTo(map);
            
            marker.bindPopup(`
                <div class="popup-content">
                    <h3>${loc.name}</h3>
                    <p><strong>Lieu réel :</strong> ${loc.realName}</p>
                    <p>${loc.description}</p>
                    <span class="popup-badge">${loc.episodeRef}</span>
                </div>
            `);

            markers[loc.id] = marker;

            // Création de la carte avec la question intégrée
            const card = document.createElement('div');
            card.className = 'location-card';
            card.innerHTML = `
                <h3>📍 ${loc.name}</h3>
                <p><em>${loc.realName}</em></p>
                <div class="question-box">
                    <strong>Défi :</strong> ${loc.question}
                </div>
                <div class="answer-container">
                    <input type="text" class="answer-input" placeholder="Ta réponse..." id="input-${loc.id}">
                    <button class="answer-btn" onclick="checkAnswer(${loc.id})">Valider</button>
                </div>
                <div class="feedback" id="feedback-${loc.id}"></div>
            `;

            // Sélection du lieu au clic sur la carte latérale
            card.addEventListener('click', (e) => {
                // Éviter le déclenchement si on clique sur l'input ou le bouton
                if(e.target.tagName === 'INPUT' || e.target.tagName === 'BUTTON') return;

                document.querySelectorAll('.location-card').forEach(c => c.classList.remove('active'));
                card.classList.add('active');

                map.flyTo(loc.coords, 16, {
                    animate: true,
                    duration: 1.5
                });
                marker.openPopup();

                missionDesc.innerHTML = `<strong>Lieu sélectionné :</strong> ${loc.name}<br><span style="font-size:0.85rem; color:#ccc;">${loc.description}</span>`;
            });

            listContainer.appendChild(card);
        });

        // Fonction de vérification des réponses de Paris Explorer
        function checkAnswer(id) {
            const loc = miraculousLocations.find(l => l.id === id);
            const inputVal = document.getElementById(`input-${id}`).value.trim().toLowerCase();
            const feedbackEl = document.getElementById(`feedback-${id}`);

            if (inputVal === loc.answer || inputVal.includes(loc.answer)) {
                feedbackEl.style.color = "#4cd137";
                feedbackEl.innerHTML = "✨ Bravo ! C'est la bonne réponse. Le lieu est validé !";
                
                // Centrer et ouvrir le popup automatiquement en cas de succès
                map.flyTo(loc.coords, 16);
                markers[id].openPopup();
            } else {
                feedbackEl.style.color = "#e3000b";
                feedbackEl.innerHTML = "❌ Oups, essaie encore ! Regarde bien les indices de la ville.";
            }
        }
    </script>
</body>
</html>
